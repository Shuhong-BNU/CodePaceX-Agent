name: P3-B paired Pilot

on:
  pull_request:
    paths:
      - ".github/workflows/p3b-paired-pilot.yml"
      - "evals/evaluation_v2/p3b_post_merge_rebind.py"
      - "evals/evaluation_v2/p3b_paid_executor.py"
      - "evals/evaluation_v2/p3b_post_merge_rebind/**"
      - "evals/paid_gate.py"
      - "tests/test_p3b_post_merge_rebind.py"
      - "tests/test_p3b_paid_executor.py"
  workflow_dispatch:
    inputs:
      paid_execution:
        description: Separately user-authorized P3-B paid execution only.
        required: true
        type: boolean
        default: false
      expected_main_sha:
        required: false
        type: string
        default: ''
      expected_freeze_sha256:
        required: false
        type: string
        default: ''
      expected_allocation_hash:
        required: false
        type: string
        default: ''
      approved_parent_cap_cny:
        required: false
        type: string
        default: ''
      authorization_acknowledgement:
        required: false
        type: string
        default: ''
      dispatch_token:
        required: false
        type: string
        default: ''
      run_id:
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: p3b-paired-pilot-${{ inputs.dispatch_token || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  p3b-zero-provider-readiness:
    if: ${{ github.event_name == 'pull_request' || inputs.paid_execution == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Boolean presence only; the secret value is never exposed to a step.
      P3B_PROVIDER_SECRET_PRESENT: ${{ secrets.BAILIAN_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -e . pytest pytest-asyncio
      - name: Verify P3-B post-merge freeze and zero-provider readiness
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_p3b_post_merge_rebind.py
          python - <<'PY'
          import json
          from pathlib import Path
          from evals.evaluation_v2 import p3b_post_merge_rebind as p3b
          root = Path('.')
          freeze = json.loads((root / p3b.ARTIFACT_DIRECTORY / p3b.FREEZE_NAME).read_text(encoding='utf-8'))
          readiness = json.loads((root / p3b.ARTIFACT_DIRECTORY / p3b.READINESS_NAME).read_text(encoding='utf-8'))
          p3b.validate_freeze(root, freeze)
          assert readiness['status'] == 'passed_zero_provider_readiness'
          assert readiness['provider_requests'] == readiness['usage'] == 0
          assert readiness['charge_cny'] == '0' and readiness['provider_secret_read'] is False
          assert readiness['rehearsal']['ledger_closed'] and readiness['rehearsal']['active_reservation'] is None
          assert readiness['paired_result_merge_count'] == 4
          adapter = readiness['rehearsal']['production_adapter_preflight']
          assert adapter['task_run_count'] == 8 and adapter['unique_instance_count'] == 4
          assert adapter['provider_transport_hard_disabled'] is True
          assert adapter['provider_requests'] == adapter['usage'] == 0
          assert adapter['charge_cny'] == '0' and adapter['active_reservation'] is None
          assert all(item['provider_transport_reached'] is False for item in adapter['records'])
          assert '${{ env.P3B_PROVIDER_SECRET_PRESENT }}' in {'true', 'false'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p3b-zero-provider-readiness-${{ github.run_id }}
          path: evals/evaluation_v2/p3b_post_merge_rebind
          if-no-files-found: error

  p3b-paid-execution:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.paid_execution == true && github.ref == 'refs/heads/main' && inputs.expected_main_sha != '' && inputs.expected_freeze_sha256 != '' && inputs.expected_allocation_hash != '' && inputs.approved_parent_cap_cny == '292.945921' && inputs.authorization_acknowledgement != '' && inputs.dispatch_token != '' && inputs.run_id != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    concurrency:
      # Artifact-local DispatchGuard cannot coordinate separate GitHub Runs.
      group: p3b-paid-execution-global-v1
      cancel-in-progress: false
    env:
      # Presence only is available before the Provider step; no Secret value is.
      P3B_PROVIDER_SECRET_PRESENT: ${{ secrets.BAILIAN_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paid executor dependencies
        run: python -m pip install -e .
      - name: Write canonical paid input bundle
        env:
          P3B_INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          P3B_INPUT_EXPECTED_FREEZE_SHA256: ${{ inputs.expected_freeze_sha256 }}
          P3B_INPUT_EXPECTED_ALLOCATION_HASH: ${{ inputs.expected_allocation_hash }}
          P3B_INPUT_APPROVED_PARENT_CAP_CNY: ${{ inputs.approved_parent_cap_cny }}
          P3B_INPUT_AUTHORIZATION_ACKNOWLEDGEMENT: ${{ inputs.authorization_acknowledgement }}
          P3B_INPUT_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          P3B_INPUT_RUN_ID: ${{ inputs.run_id }}
          P3B_INPUT_BUNDLE: ${{ runner.temp }}/p3b-paid-inputs-${{ github.run_id }}.json
        run: |
          python - "$P3B_INPUT_BUNDLE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from evals.evaluation_v2.p3b_paid_executor import canonical_paid_input_bundle

          bundle = canonical_paid_input_bundle(
              expected_main_sha=os.environ["P3B_INPUT_EXPECTED_MAIN_SHA"],
              expected_freeze_sha256=os.environ["P3B_INPUT_EXPECTED_FREEZE_SHA256"],
              expected_allocation_hash=os.environ["P3B_INPUT_EXPECTED_ALLOCATION_HASH"],
              approved_parent_cap_cny=os.environ["P3B_INPUT_APPROVED_PARENT_CAP_CNY"],
              authorization_acknowledgement=os.environ["P3B_INPUT_AUTHORIZATION_ACKNOWLEDGEMENT"],
              dispatch_token=os.environ["P3B_INPUT_DISPATCH_TOKEN"],
              run_id=os.environ["P3B_INPUT_RUN_ID"],
              provider_secret_present=os.environ["P3B_PROVIDER_SECRET_PRESENT"] == "true",
          )
          Path(sys.argv[1]).write_text(json.dumps(bundle), encoding="utf-8")
          PY
      - name: Validate paid inputs without Provider access
        env:
          P3B_INPUT_BUNDLE: ${{ runner.temp }}/p3b-paid-inputs-${{ github.run_id }}.json
          P3B_PREFLIGHT_ARTIFACT: ${{ runner.temp }}/p3b-paid-input-preflight-${{ github.run_id }}
        run: |
          python -m evals.evaluation_v2.p3b_paid_executor \
            --root . \
            --artifact-root "$P3B_PREFLIGHT_ARTIFACT" \
            --input-bundle "$P3B_INPUT_BUNDLE" \
            --validate-inputs-only
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: p3b-paid-input-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/p3b-paid-input-preflight-${{ github.run_id }}
          if-no-files-found: error
      - name: Run the explicitly authorized P3-B executor
        env:
          # The Secret value exists only in this Provider-capable step.
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          P3B_INPUT_BUNDLE: ${{ runner.temp }}/p3b-paid-inputs-${{ github.run_id }}.json
          P3B_PAID_ARTIFACT: ${{ runner.temp }}/p3b-paid-artifact-${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.p3b_paid_executor \
            --root . \
            --artifact-root "$P3B_PAID_ARTIFACT" \
            --input-bundle "$P3B_INPUT_BUNDLE" \
            --confirm-paid-execution
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from evals.evaluation_v2.p3b_paid_executor import PAID_SUMMARY_NAME
          artifact = Path(os.environ['P3B_PAID_ARTIFACT'])
          summary = json.loads((artifact / PAID_SUMMARY_NAME).read_text(encoding='utf-8'))
          assert summary['completed'] is True
          assert summary['ledger_closed'] is True and summary['active_reservation'] is None
          assert len(summary['records']) == 8 and summary['paired_result_merge_count'] == 4
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: p3b-paid-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/p3b-paid-artifact-${{ github.run_id }}
          if-no-files-found: error
