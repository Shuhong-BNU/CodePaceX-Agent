name: Evaluation V2 Goal 4 full 20-task replay

on:
  pull_request:
    paths:
      - ".github/workflows/evaluation-v2-full-20-replay.yml"
      - "evals/evaluation_v2/full_replay.py"
      - "evals/evaluation_v2/capability_v3_pilot.py"
      - "evals/evaluation_v2/control_canary.py"
      - "evals/evaluation_v2/full_replay_payloads/**"
      - "tests/test_evaluation_v2_full_replay.py"
      - "tests/test_capability_v3_controlled_pilot.py"
      - "evals/EVALUATION_HISTORY.md"
      - "evals/EVALUATION_ARTIFACT_INDEX.md"
      - "evals/evaluation_v2/FULL_20_REPLAY.md"
  workflow_dispatch:
    inputs:
      paid_execution:
        description: Separately authorized full 20-task replay only. Defaults to the zero-provider readiness path.
        required: true
        type: boolean
        default: false
      expected_freeze_sha256:
        description: Exact committed full-20 Freeze SHA-256 required by a future paid run.
        required: false
        type: string
        default: ''
      approved_total_hard_cap_cny:
        description: Exact frozen CNY 250.000000 cap required by a future paid run.
        required: false
        type: string
        default: '250.000000'
      authorization_acknowledgement:
        description: Future one-time authorization acknowledgement. Never needed for the zero-provider path.
        required: false
        type: string
        default: ''
      run_id:
        description: Fresh future paid run ID. Never needed for the zero-provider path.
        required: false
        type: string
        default: ''
      controlled_pilot_paid_execution:
        description: Separately authorized six-task V2_CONTROL/V3_CORE controlled Pilot only.
        required: true
        type: boolean
        default: false
      controlled_pilot_expected_freeze_sha256:
        description: Exact controlled-Pilot Freeze SHA-256 from main.
        required: false
        type: string
        default: ''
      controlled_pilot_expected_allocation_hash:
        description: Exact run-scoped Stage C allocation SHA-256 from the controlled-Pilot Freeze.
        required: false
        type: string
        default: ''
      controlled_pilot_approved_total_hard_cap_cny:
        description: Exact controlled-Pilot hard cap from its Freeze.
        required: false
        type: string
        default: ''
      controlled_pilot_authorization_acknowledgement:
        description: One-time user authorization acknowledgement for the controlled Pilot.
        required: false
        type: string
        default: ''
      controlled_pilot_run_id:
        description: Fresh controlled-Pilot Run ID; never reused.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  zero-provider-full-readiness:
    if: ${{ github.event_name == 'pull_request' || inputs.paid_execution == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      EVALUATOR_COMMIT: ad79b850f15e33992e96f03f6e97f05ddf9aa0be
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve remote main ref for release readiness
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify refs/remotes/origin/main^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare fresh full-replay artifact directory
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/evaluation-v2-full-20/$GITHUB_RUN_ID"
          mkdir -p "$root"
          printf 'FULL_REPLAY_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install project and frozen official evaluator
        run: |
          set -euo pipefail
          docker info >/dev/null
          python -m pip install -e . pytest pytest-asyncio
          evaluator_root="$RUNNER_TEMP/swe-bench-live"
          git clone --filter=blob:none https://github.com/microsoft/SWE-bench-Live.git "$evaluator_root"
          git -C "$evaluator_root" checkout --detach "$EVALUATOR_COMMIT"
          test "$(git -C "$evaluator_root" rev-parse HEAD)" = "$EVALUATOR_COMMIT"
          python -m pip install -e "$evaluator_root"
      - name: Validate the frozen Goal 4 full-20 contract
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.full_replay validate --root . > "$FULL_REPLAY_ROOT/contract-validation.json"
      - name: Preflight all twenty task environments without Provider transport
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.full_replay preflight --root . --artifact-root "$FULL_REPLAY_ROOT/preflight" > "$FULL_REPLAY_ROOT/preflight-result.json"
          python - "$FULL_REPLAY_ROOT/preflight/preflight-summary.json" <<'PY'
          import json, pathlib, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['passed'] is True
          assert summary['ready_count'] == 20
          assert summary['provider_requests'] == summary['usage'] == 0
          assert summary['charge_cny'] == '0' and summary['provider_secret_read'] is False
          assert all(item['disk_usage']['before_cleanup']['df_h']['exit_code'] == 0 for item in summary['tasks'])
          assert all(item['disk_usage']['before_cleanup']['df_i']['exit_code'] == 0 for item in summary['tasks'])
          assert all(item['disk_usage']['after_cleanup']['venv_bytes'] == 0 for item in summary['tasks'])
          instructlab = next(item for item in summary['tasks'] if item['instance_id'] == 'instructlab__instructlab-2540')
          bootstrap = json.load(open(pathlib.Path(sys.argv[1]).parent / 'tasks' / instructlab['instance_id'] / 'evidence' / 'dependency-bootstrap.json', encoding='utf-8'))
          assert bootstrap[0]['environment']['PIP_EXTRA_INDEX_URL'] == 'https://download.pytorch.org/whl/cpu'
          assert bootstrap[0]['environment']['CMAKE_ARGS'] == '-DLLAMA_NATIVE=off'
          PY
      - name: Run the complete 6 plus 14 shadow without Provider transport
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.full_replay shadow --root . --preflight-summary "$FULL_REPLAY_ROOT/preflight/preflight-summary.json" --artifact-root "$FULL_REPLAY_ROOT/shadow" --run-id "shadow-$GITHUB_RUN_ID" > "$FULL_REPLAY_ROOT/shadow-result.json"
          python - "$FULL_REPLAY_ROOT/shadow/full-20-shadow-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['paid_execution'] is False
          assert summary['provider_requests'] == summary['usage'] == 0
          assert summary['charge_cny'] == '0' and summary['provider_secret_read'] is False
          assert summary['phase_a_completed'] and summary['phase_b_admitted'] and summary['phase_b_completed']
          assert summary['ledger_closed'] and summary['active_reservation'] is None
          assert len(summary['results']) == 20
          assert summary['agent_dispatch_count'] == 20
          assert summary['provider_task_coverage'] == '20/20'
          assert summary['historical_control_dispatch_covered'] is True
          assert all(item['simulated_provider_requests'] >= 1 for item in summary['results'])
          PY
      - name: Compile release readiness on main only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.full_replay release-check --root . --preflight-summary "$FULL_REPLAY_ROOT/preflight/preflight-summary.json" --shadow-summary "$FULL_REPLAY_ROOT/shadow/full-20-shadow-summary.json" --output "$FULL_REPLAY_ROOT/release-check.json" > "$FULL_REPLAY_ROOT/release-check-result.json"
          python - "$FULL_REPLAY_ROOT/release-check.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          assert result['status'] == 'READY_FOR_NEW_UNIFIED_FULL_20_PAID_AUTHORIZATION'
          assert result['head'] == result['origin_main']
          assert result['provider_requests'] == result['usage'] == 0
          assert result['charge_cny'] == '0' and result['provider_secret_read'] is False
          PY
      - name: Upload full replay readiness Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-v2-full-20-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/evaluation-v2-full-20/${{ github.run_id }}
          if-no-files-found: warn

  paid-execution:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.paid_execution == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    env:
      EVALUATOR_COMMIT: ad79b850f15e33992e96f03f6e97f05ddf9aa0be
      BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and frozen official evaluator
        run: |
          set -euo pipefail
          docker info >/dev/null
          python -m pip install -e . pytest pytest-asyncio
          evaluator_root="$RUNNER_TEMP/swe-bench-live"
          git clone --filter=blob:none https://github.com/microsoft/SWE-bench-Live.git "$evaluator_root"
          git -C "$evaluator_root" checkout --detach "$EVALUATOR_COMMIT"
          test "$(git -C "$evaluator_root" rev-parse HEAD)" = "$EVALUATOR_COMMIT"
          python -m pip install -e "$evaluator_root"
      - name: Run the explicitly authorized full 20-task replay
        run: |
          set -euo pipefail
          test '${{ inputs.paid_execution }}' = true
          root="$RUNNER_TEMP/evaluation-v2-full-20-paid/${{ inputs.run_id }}"
          mkdir -p "$root"
          python -m evals.evaluation_v2.full_replay preflight --root . --artifact-root "$root/preflight" > "$root/preflight-result.json"
          python - "$root/preflight/preflight-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['passed'] is True and summary['ready_count'] == 20
          PY
          python -m evals.evaluation_v2.full_replay paid-run --confirm-paid-execution --root . --artifact-root "$root/paid" --expected-freeze-sha256 '${{ inputs.expected_freeze_sha256 }}' --approved-total-hard-cap-cny '${{ inputs.approved_total_hard_cap_cny }}' --authorization-acknowledgement '${{ inputs.authorization_acknowledgement }}' --run-id '${{ inputs.run_id }}' > "$root/paid-result.json"
      - name: Upload paid full replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-v2-full-20-paid-${{ inputs.run_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evaluation-v2-full-20-paid/${{ inputs.run_id }}
          if-no-files-found: warn

  zero-provider-controlled-pilot-readiness:
    if: ${{ github.event_name == 'pull_request' || inputs.controlled_pilot_paid_execution == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      EVALUATOR_COMMIT: ad79b850f15e33992e96f03f6e97f05ddf9aa0be
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and frozen official evaluator
        run: |
          set -euo pipefail
          docker info >/dev/null
          python -m pip install -e . pytest pytest-asyncio
          evaluator_root="$RUNNER_TEMP/swe-bench-live"
          git clone --filter=blob:none https://github.com/microsoft/SWE-bench-Live.git "$evaluator_root"
          git -C "$evaluator_root" checkout --detach "$EVALUATOR_COMMIT"
          test "$(git -C "$evaluator_root" rev-parse HEAD)" = "$EVALUATOR_COMMIT"
          python -m pip install -e "$evaluator_root"
      - name: Freeze and validate the six-task V2/V3 contract without Provider transport
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/capability-v3-controlled-pilot/$GITHUB_RUN_ID"
          mkdir -p "$root"
          printf 'CONTROLLED_PILOT_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          python -m evals.evaluation_v2.capability_v3_pilot freeze --root . --output "$root/freeze" --run-id "readiness-$GITHUB_RUN_ID" > "$root/freeze-result.json"
          python -m evals.evaluation_v2.capability_v3_pilot validate --root . --freeze "$root/freeze" > "$root/freeze-validation.json"
      - name: Preflight all six controlled-Pilot task environments without Provider transport
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.capability_v3_pilot preflight --root . --freeze "$CONTROLLED_PILOT_ROOT/freeze" --artifact-root "$CONTROLLED_PILOT_ROOT/preflight" > "$CONTROLLED_PILOT_ROOT/preflight-result.json"
          python - "$CONTROLLED_PILOT_ROOT/preflight/preflight-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['passed'] is True and summary['ready_count'] == 6
          assert summary['provider_requests'] == summary['usage'] == 0
          assert summary['charge_cny'] == '0' and summary['provider_secret_read'] is False
          PY
      - name: Rehearse all twelve flag-to-Agent and Artifact hand-offs without Provider transport
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.capability_v3_pilot rehearse --root . --freeze "$CONTROLLED_PILOT_ROOT/freeze" --preflight-summary "$CONTROLLED_PILOT_ROOT/preflight/preflight-summary.json" --artifact-root "$CONTROLLED_PILOT_ROOT/rehearsal" > "$CONTROLLED_PILOT_ROOT/rehearsal-result.json"
          python - "$CONTROLLED_PILOT_ROOT/rehearsal/controlled-pilot-rehearsal-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['completed'] is True
          assert summary['flag_handoffs_verified'] == ['V2_CONTROL', 'V3_CORE']
          assert summary['provider_requests'] == summary['usage'] == 0
          assert summary['charge_cny'] == '0' and summary['provider_secret_read'] is False
          assert len(summary['run_artifacts']) == 12
          PY
      - name: Rehearse the real Stage C allocation execution entry without Provider transport
        run: |
          set -euo pipefail
          python -m evals.evaluation_v2.capability_v3_pilot rehearse-execution-entry --root . --freeze "$CONTROLLED_PILOT_ROOT/freeze" --preflight-summary "$CONTROLLED_PILOT_ROOT/preflight/preflight-summary.json" --artifact-root "$CONTROLLED_PILOT_ROOT/execution-entry" > "$CONTROLLED_PILOT_ROOT/execution-entry-result.json"
          python - "$CONTROLLED_PILOT_ROOT/execution-entry/controlled-pilot-execution-entry-rehearsal.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['completed'] is True
          assert summary['provider_requests'] == summary['usage'] == 0
          assert summary['charge_cny'] == '0' and summary['provider_secret_read'] is False
          assert summary['active_reservation'] is None
          assert len(summary['task_runs']) == 12
          assert summary['ledger_allocation_hash'] == summary['allocation_binding']['allocation_hash']
          allocations = summary['allocation_binding']['task_run_allocations']
          assert len(allocations) == 12
          assert len({item['task_run_id'] for item in allocations}) == 12
          assert len({item['task_run_allocation_id'] for item in allocations}) == 12
          assert len({item['task_run_allocation_hash'] for item in allocations}) == 12
          assert all(item['theoretical_ceiling_cny'] == '73.236480' for item in allocations)
          assert all(item['settlement_cny'] == '0' and item['status'] == 'cancelled' for item in summary['task_runs'])
          assert all(item['task_run_allocation_id'] and item['task_run_allocation_hash'] for item in summary['task_runs'])
          PY
      - name: Upload controlled-Pilot zero-provider readiness Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-v3-controlled-pilot-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/capability-v3-controlled-pilot/${{ github.run_id }}
          if-no-files-found: warn

  controlled-pilot-paid-execution:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_pilot_paid_execution == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    env:
      EVALUATOR_COMMIT: ad79b850f15e33992e96f03f6e97f05ddf9aa0be
      BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and frozen official evaluator
        run: |
          set -euo pipefail
          docker info >/dev/null
          python -m pip install -e . pytest pytest-asyncio
          evaluator_root="$RUNNER_TEMP/swe-bench-live"
          git clone --filter=blob:none https://github.com/microsoft/SWE-bench-Live.git "$evaluator_root"
          git -C "$evaluator_root" checkout --detach "$EVALUATOR_COMMIT"
          python -m pip install -e "$evaluator_root"
      - name: Run the explicitly authorized serial six-task V2/V3 Pilot
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/capability-v3-controlled-pilot-paid/${{ inputs.controlled_pilot_run_id }}"
          mkdir -p "$root"
          python -m evals.evaluation_v2.capability_v3_pilot freeze --root . --output "$root/freeze" --run-id '${{ inputs.controlled_pilot_run_id }}' --approved-total-hard-cap-cny '${{ inputs.controlled_pilot_approved_total_hard_cap_cny }}' > "$root/freeze-result.json"
          python -m evals.evaluation_v2.capability_v3_pilot preflight --root . --freeze "$root/freeze" --artifact-root "$root/preflight" > "$root/preflight-result.json"
          python -m evals.evaluation_v2.capability_v3_pilot paid-run --confirm-paid-execution --root . --freeze "$root/freeze" --artifact-root "$root/paid" --expected-freeze-sha256 '${{ inputs.controlled_pilot_expected_freeze_sha256 }}' --expected-allocation-hash '${{ inputs.controlled_pilot_expected_allocation_hash }}' --approved-total-hard-cap-cny '${{ inputs.controlled_pilot_approved_total_hard_cap_cny }}' --authorization-acknowledgement '${{ inputs.controlled_pilot_authorization_acknowledgement }}' --run-id '${{ inputs.controlled_pilot_run_id }}' > "$root/paid-result.json"
      - name: Verify controlled-Pilot paid terminal contract
        if: always()
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/capability-v3-controlled-pilot-paid/${{ inputs.controlled_pilot_run_id }}"
          python -m evals.evaluation_v2.capability_v3_pilot assert-paid-terminal --summary "$root/paid/controlled-pilot-paid-summary.json" > "$root/paid-terminal-contract.json"
      - name: Upload controlled-Pilot paid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-v3-controlled-pilot-paid-${{ inputs.controlled_pilot_run_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capability-v3-controlled-pilot-paid/${{ inputs.controlled_pilot_run_id }}
          if-no-files-found: warn
